spring.application.name=blog
spring.datasource.url=jdbc:h2:file:${BLOG_DATA_DIR:./data}/blog
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=32MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${BLOG_SECURE_COOKIES:false}
server.servlet.session.timeout=30m
server.error.include-message=never
blog.admin.username=${BLOG_ADMIN_USERNAME:admin}
blog.admin.password=${BLOG_ADMIN_PASSWORD}
blog.upload-dir=${BLOG_DATA_DIR:./data}/uploads
